<!doctype html>

<head>

<style>
/* Layout: columna única pensada para el móvil. Tarjetas tipo hoja de cuaderno, navegación inferior con botón + central. Misma paleta oscura de la libreta. */
:root{
  --bg:#0b0b0c; --page:#141416; --page2:#1b1b1e; --ink:#fff3e2; --muted:#a89a85; --line:rgba(255,255,255,.09);
  --yellow:#ffa526; --mint:#4fd1a1; --coral:#ff5a5f; --lilac:#b69cff; --blue:#6cb6ff; --good:#4fd1a1; --bad:#ff5a5f;
  --on-accent:#0b0b0c;
  --hand:'Caveat','Segoe Print','Bradley Hand',cursive; --body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace; --marker:'Permanent Marker','Caveat',cursive;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);
  padding-block:0 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100vh}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-top:22px}
.kick{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--body);font-weight:600;font-size:34px;letter-spacing:-.02em;line-height:1.1;margin:2px 0 0;text-wrap:balance}
h2{font-family:var(--body);font-weight:600;font-size:21px;letter-spacing:-.01em;line-height:1.2;margin:0 0 10px}
h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 10px;font-weight:600}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:13px}
.sync{font-size:12px;padding:4px 10px;border-radius:5px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.sync.ok{color:var(--mint);border-color:rgba(94,234,212,.4)}
.sync.err{color:var(--coral);border-color:rgba(255,122,107,.5)}
.stack{display:grid;gap:14px;margin-top:18px}
.card{background:var(--page);border:1px solid var(--line);border-radius:6px;padding:16px}
.card.hl{border-color:rgba(255,165,38,.5);box-shadow:0 0 16px rgba(255,165,38,.14)}
.card.warn{border-color:rgba(255,122,107,.5)}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--page2);border:1px solid var(--line);border-radius:5px;padding:10px 12px;min-width:0}
.stat.pos{border-color:rgba(79,209,161,.5);box-shadow:0 0 10px rgba(79,209,161,.12)}
.stat.neg{border-color:rgba(255,90,95,.5);box-shadow:0 0 10px rgba(255,90,95,.12)}
.stat small{display:block;font-size:11.5px;color:var(--muted)}
.stat b{font-family:var(--mono);font-weight:500;font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--good)} .neg{color:var(--bad)}
.bar{height:10px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;margin:8px 0 6px}
.bar i{display:block;height:100%;border-radius:6px;background:var(--yellow)}
.bar.m i{background:var(--mint)}
.clock{font-family:var(--mono);font-weight:500;font-size:46px;line-height:1;font-variant-numeric:tabular-nums;margin:4px 0}
.clock.in{color:var(--mint)} .clock.before{color:var(--yellow)}
.btn{min-height:44px;padding:8px 16px;border-radius:6px;border:1px solid var(--line);background:rgba(255,255,255,.06);font-weight:500}
.btn:hover{background:rgba(255,255,255,.1)}
.btn.pri{background:var(--yellow);color:var(--on-accent);border-color:var(--yellow);font-weight:600}
.btn.pri:hover{background:#ffbe5c}
.btn.danger{border-color:rgba(255,122,107,.6);color:var(--coral)}
.btn.sm{min-height:36px;padding:4px 12px;font-size:14px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.todo{display:flex;width:100%;text-align:left;gap:10px;align-items:center;justify-content:space-between;min-height:48px;padding:10px 14px;border-radius:6px;border:1px solid var(--line);background:var(--page2);margin-top:8px}
.todo span{color:var(--muted);font-size:13px}
.todo.u{border-color:rgba(255,122,107,.55);background:rgba(255,122,107,.08)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--page);padding:4px;border-radius:6px;border:1px solid var(--line)}
.seg button{min-height:40px;border:0;border-radius:5px;background:transparent;color:var(--muted);font-weight:500;font-size:13.5px;padding:0 4px;white-space:nowrap}
.seg button.on{background:var(--yellow);color:var(--on-accent);font-weight:600}
.day{display:flex;justify-content:space-between;align-items:baseline;margin:18px 2px 6px}
.day b{font-family:var(--body);font-size:17px;font-weight:600}
.tr{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 14px;border-radius:6px;border:1px solid var(--line);background:var(--page);margin-top:8px;min-width:0}
.tr:hover{border-color:rgba(255,165,38,.5)}
.dir{width:34px;height:34px;border-radius:5px;display:grid;place-items:center;font-weight:700;background:rgba(108,182,255,.15);color:var(--blue)}
.dir.s{background:rgba(182,156,255,.15);color:var(--lilac)}
.tr .mid{min-width:0}
.tr .t1{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .t2{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:12px;padding:1px 9px;border-radius:5px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--muted)}
.tag.good{color:var(--mint);border-color:rgba(94,234,212,.4)} .tag.bad{color:var(--coral);border-color:rgba(255,122,107,.45)} .tag.neu{color:var(--yellow);border-color:rgba(255,165,38,.4)}
.tr .amt{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums;text-align:right}
.srow{position:relative;display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:9px 10px;border-radius:4px;margin-top:6px;overflow:hidden;background:var(--page2);min-width:0}
.srow .sbar{position:absolute;left:0;top:0;bottom:0;opacity:.22}
.srow>*:not(.sbar){position:relative;min-width:0}
.srow .sn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .sm{font-size:12.5px;color:var(--muted);white-space:nowrap}
.srow b{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.srow.few{opacity:.6}
.insight{padding:12px 14px;border-radius:6px;background:var(--page2);border-left:4px solid var(--yellow);margin-top:8px}
.insight.bad{border-left-color:var(--coral)} .insight.good{border-left-color:var(--mint)}
.empty{text-align:center;padding:26px 16px}
.empty h2{margin-bottom:6px}
textarea.hw{width:100%;min-height:96px;resize:vertical;background:var(--page2);border:1px solid var(--line);border-radius:6px;padding:12px;font-family:var(--body);font-size:15px;line-height:1.45}
input[type=text],input[type=number],input[type=date],input[type=time],input[inputmode]{width:100%;min-height:44px;background:var(--page2);border:1px solid var(--line);border-radius:5px;padding:8px 12px}
.field{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.banner{padding:10px 14px;border-radius:6px;border:1px dashed rgba(255,165,38,.55);background:rgba(255,165,38,.07);font-size:14px}
/* navegación */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(11,11,12,.96);border-top:1px solid var(--line);
  padding:6px max(10px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));backdrop-filter:blur(8px)}
.bnav .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 74px 1fr 1fr;align-items:center}
.bnav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:5px;text-decoration:none;color:var(--muted);font-size:11.5px;min-height:48px;justify-content:center}
.bnav a.on{color:var(--yellow)}
.bnav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.plus{justify-self:center;width:56px;height:56px;margin-top:-22px;border-radius:50%;border:4px solid var(--bg);background:var(--yellow);color:var(--on-accent);font-size:32px;line-height:1;font-weight:500;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.5)}
/* hoja de anotación */
#sheetWrap{position:fixed;inset:0;z-index:60}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.65)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:94%;max-width:640px;margin:0 auto;background:var(--page);border-radius:5px 10px 0 0;border:1px solid var(--line);display:flex;flex-direction:column}
.sh-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sh-body{overflow:auto;padding:4px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));display:grid;gap:16px}
.sh-foot{display:flex;gap:10px;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:var(--page)}
.sh-foot .pri{flex:1}
.lbl{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:6px 14px;border-radius:5px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-size:14.5px}
.chip.on{background:rgba(255,165,38,.2);border-color:var(--yellow);color:var(--yellow)}
.chip.on.good{background:rgba(94,234,212,.18);border-color:var(--mint);color:var(--mint)}
.chip.on.bad{background:rgba(255,122,107,.18);border-color:var(--coral);color:var(--coral)}
.big2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big2 .chip{min-height:52px;border-radius:6px;font-size:17px;font-weight:600}
.emo{display:grid;grid-template-columns:70px 1fr;gap:8px;align-items:start;margin-bottom:8px}
.emo>span{font-size:13px;color:var(--muted);padding-top:10px}
.emo .chip{min-height:36px;padding:4px 12px;font-size:14px}
.imgslot{margin:0 0 12px}
.imgprev{display:block;width:100%;max-height:170px;object-fit:cover;border-radius:5px;margin-top:8px;border:1px solid var(--line)}
.ggrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.gtile{display:flex;flex-direction:column;gap:4px;padding:0;border:1px solid var(--line);border-radius:5px;background:var(--page2);color:var(--ink);text-align:left;overflow:hidden}
.gtile img{width:100%;height:96px;object-fit:cover;display:block}
.gtile .gcap{padding:0 8px 8px;font-size:12px;line-height:1.3;color:var(--muted)}
.chkq{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.chkq>span{flex:1;font-size:14px;line-height:1.3}
.chkq .chip{min-height:36px;padding:4px 14px;font-size:14px}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#0b0c10;border:1px solid var(--line);padding:10px 18px;border-radius:5px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:80;max-width:90%}
#toast.show{opacity:1}
.soon{opacity:.85;border-style:dashed}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (min-width:700px){.sheet{border-radius:8px;bottom:24px}}
.sync{cursor:pointer}
.lvl{border-left:4px solid var(--line)}.lvl.ok{border-left-color:var(--mint)}.lvl.care{border-left-color:var(--yellow)}.lvl.no{border-left-color:var(--coral)}.lvl.closed{border-left-color:#fff}
.lst{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:8px}.lst li{font-size:14.5px}
/* zona de estudio (el resto del estilo está en estudio/estudio.css) */
.wrap.study{max-width:900px}
.study a{color:inherit}
.study h3{text-transform:none;letter-spacing:0}
.study h2{flex-wrap:wrap}
.study .card{border:0;border-top:4px solid var(--c,#ffa526)}
.study.repaso .detail{display:none}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;gap:4px;padding:16px;border-radius:6px;background:var(--page2);border:1px solid var(--line);text-decoration:none;color:var(--ink);min-height:84px;cursor:pointer}
.tile small{color:var(--muted);font-size:12px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.dcard{display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:6px;background:var(--page2);border:1px solid var(--line);text-decoration:none;color:var(--ink);min-height:96px}
.dcard .dn{font-family:var(--marker);font-size:16px;color:var(--yellow)}
.dcard.off{opacity:.45}
.rng{position:relative;height:10px;border-radius:3px;background:linear-gradient(90deg,rgba(255,90,95,.35),rgba(255,255,255,.06) 50%,rgba(79,209,161,.35));margin:16px 0 6px}
.rng i{position:absolute;top:-4px;width:4px;height:18px;border-radius:2px;background:var(--yellow);transform:translateX(-50%)}
.rng u{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.55)}
.hb{display:grid;grid-template-columns:minmax(84px,40%) 1fr auto;gap:8px;align-items:center;margin:7px 0;font-size:12.5px}
.hb .hk{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .ht{height:8px;border-radius:2px;background:rgba(255,255,255,.06);overflow:hidden}
.hb .ht i{display:block;height:100%;border-radius:2px}
.hb b{font-family:var(--mono);font-weight:500;font-size:12px;white-space:nowrap}
.calh,.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.calh span{font-size:11px;color:var(--muted);text-align:center;margin-bottom:2px}
.cl{aspect-ratio:1.25/1;border-radius:4px;background:rgba(255,255,255,.07);padding:3px 4px;display:flex;flex-direction:column;justify-content:space-between;min-width:0;overflow:hidden}
.cl.e{background:rgba(255,255,255,.025)}
.cl span{font-size:10.5px;color:var(--muted)}
.cl b{font-family:var(--mono);font-weight:500;font-size:10px;color:#fff;text-align:right;line-height:1}
.mxg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mx{border:1px solid var(--line);border-radius:5px;padding:9px 10px}
.mx small{display:block;color:var(--muted);font-size:11.5px}
.mx b{font-family:var(--mono);font-weight:500;font-size:16px}
.tile:hover,.dcard:hover{border-color:var(--yellow)}
@media (max-width:600px){.study .sheet{padding:26px 14px 36px 44px}.study .sheet::before{width:22px;background-size:22px 44px}.study .sheet::after{left:34px}.study h1{font-size:30px}.dgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head>

<script>
/* ============ utilidades ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const TZ_NY='America/New_York',TZ_ES='Europe/Madrid';
const DOW=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MON=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function parts(ms,tz){const o={};new Intl.DateTimeFormat('en-CA',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'}).formatToParts(ms).forEach(x=>{o[x.type]=x.value;});return{y:+o.year,mo:+o.month,d:+o.day,h:+o.hour%24,mi:+o.minute,s:+o.second};}
const ymd=(y,m,d)=>y+'-'+pad(m)+'-'+pad(d);
const dateOf=(ms,tz)=>{const p=parts(ms,tz||TZ_ES);return ymd(p.y,p.mo,p.d);};
const hm=(ms,tz)=>{const p=parts(ms,tz||TZ_ES);return pad(p.h)+':'+pad(p.mi);};
const dowOf=ds=>new Date(ds+'T12:00:00Z').getUTCDay();
const addD=(ds,n)=>{const d=new Date(ds+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);};
const mondayOf=ds=>addD(ds,-((dowOf(ds)+6)%7));
function zonedToUtc(ds,t,tz){const a=ds.split('-').map(Number),b=t.split(':').map(Number);const target=Date.UTC(a[0],a[1]-1,a[2],b[0],b[1]);let g=target;for(let i=0;i<3;i++){const p=parts(g,tz);g+=target-Date.UTC(p.y,p.mo-1,p.d,p.h,p.mi);}return g;}
const niceDate=ds=>{const a=ds.split('-').map(Number);return DOW[dowOf(ds)]+' '+a[2]+' '+MON[a[1]-1];};
const todayES=()=>dateOf(Date.now(),TZ_ES);

  const gw=w.reduce((x,t)=>x+t.res,0),gl=c.filter(t=>t.res<0).reduce((x,t)=>x-t.res,0);
  return{n:a.length,c:c.length,w:w.length,win:c.length?100*w.length/c.length:null,net,avg:c.length?net/c.length:null,avgR:rs.length?rs.reduce((x,t)=>x+t.r,0)/rs.length:null,pf:gl?gw/gl:null};}
function group(a,fn){const m={};a.forEach(t=>{[].concat(fn(t)).filter(Boolean).forEach(k=>{(m[k]=m[k]||[]).push(t);});});return Object.entries(m).map(([k,v])=>Object.assign({k},agg(v)));}

function tradeRow(t){
  const sd=t.sd?'Día sin detalle':t.kl?(t.kl+' · '+(!t.ifvg||t.ifvg==='Sin IFVG'?'sin IFVG':'IFVG '+t.ifvg)):((t.setup||[]).slice(0,3).join(' · ')||'Sin setup');
  const tags=[];
  if(isPend(t))tags.push('<span class="tag neu">por completar</span>');
  if(t.sd)tags.push('<span class="tag neu">sin detalle</span>');
  if(isReal(t)&&filtersHit(t).length)tags.push('<span class="tag bad">contra tu filtro</span>');
  if(t.kind)tags.push('<span class="tag">'+OP_TIPO_N[t.kind]+'</span>');
  if(t.risk>0)tags.push('<span class="tag">riesgo '+plain(t.risk)+(t.rr>0?' · '+rrTxt(t.rr):'')+'</span>');
  if(t.conf&&t.conf.length)tags.push('<span class="tag">'+t.conf.length+' confluencias</span>');
  if(t.v>=3||imgCount(t)){const n=imgCount(t);tags.push('<span class="tag '+(n>=3?'good':'neu')+'">Imágenes '+n+'/3</span>');}
  const ps=chkScore(t);if(ps!=null){const pr=ps/chkTot(t);tags.push('<span class="tag '+(pr>=0.75?'good':pr>=0.5?'neu':'bad')+'">Proceso '+ps+'/'+chkTot(t)+'</span>');}
  if(t.pre)tags.push('<span class="tag '+(EMO_TONE[t.pre]||'')+'">'+esc(t.pre)+'</span>');
  durs(t).slice(0,2).forEach(e=>tags.push('<span class="tag '+(EMO_TONE[e]||'')+'">durante: '+esc(e)+'</span>'));
  if(t.rules)tags.push('<span class="tag '+(t.rules==='si'?'good':t.rules==='no'?'bad':'neu')+'">Reglas: '+RULES[t.rules]+'</span>');
  (t.errs||[]).slice(0,2).forEach(e=>tags.push('<span class="tag bad">'+esc(e)+'</span>'));
  if(t.ex)tags.push('<span class="tag">ejemplo</span>');
  if(t.imp)tags.push('<span class="tag">Tradovate</span>');
  if(t.left>0)tags.push('<span class="tag neu">dejaste '+plain(t.left)+'</span>');
  return '<button class="tr" '+(t.sd?'data-bk="sdedit|'+t.id+'"':'data-act="edit" data-id="'+t.id+'"')+'><span class="dir '+(t.side==='short'?'s':'')+'">'+(t.sd?'Σ':t.side==='short'?'V':'C')+'</span><span class="mid"><div class="t1">'+(t.kind==='bt'?dShort(t.date)+' ':'')+esc(t.time||'')+(t.kind==='bt'&&t.tz==='NY'?' NY':'')+' · '+esc(sd)+'</div><div class="t2">'+tags.join('')+'</div></span>'+
   '<span class="amt '+(t.res==null?'muted':cls(t.res))+'">'+(t.res==null?'abierta':money(t.res))+(typeof t.r==='number'?'<div class="small muted">'+(t.r>0?'+':t.r<0?'−':'')+Math.abs(t.r).toLocaleString('es-ES')+' R</div>':'')+'</span></button>';}

function statSection(title,rows,note){
  if(!rows.length)return '';
  rows=rows.slice().sort((a,b)=>b.c-a.c||b.net-a.net);
  const mx=Math.max(1,...rows.map(r=>Math.abs(r.net)));
  return '<section class="card"><h3>'+title+'</h3>'+rows.map(r=>'<div class="srow'+(r.c<5?' few':'')+'"><span class="sbar" style="width:'+(100*Math.abs(r.net)/mx).toFixed(0)+'%;background:'+(r.net>=0?'var(--good)':'var(--bad)')+'"></span><span class="sn">'+esc(r.k)+'</span><span class="sm">'+r.c+' op · '+(r.win==null?'—':Math.round(r.win)+' %')+'</span><b class="'+cls(r.net)+'">'+money(r.net)+'</b></div>').join('')+(note?'<p class="small muted" style="margin:10px 0 0">'+note+'</p>':'')+'</section>';}

function insights(a){
  const out=[],cl=closed(a),r=group(cl.filter(t=>t.rules),t=>RULES[t.rules]);
  const sum=x=>x.reduce((p,t)=>p+t.res,0);
  /* 1) lo que haces para fallar */
  const pc=cl.filter(chkDone),flojo=pc.filter(t=>!chkGood(t)),buen=pc.filter(chkGood),luckyP=flojo.filter(t=>t.res>0);
  if(luckyP.length>=2)out.push(['Ganaste <b>'+luckyP.length+'</b> operaciones con proceso flojo en el checklist ('+money(sum(luckyP))+'): es suerte, no hábito.','bad']);
  const failQ=group(pc,t=>chkFails(t)).filter(x=>x.c>=3).sort((x,y)=>x.net-y.net)[0];
  if(failQ&&failQ.net<0)out.push(['Tu fallo más caro del checklist: <b>«'+esc(failQ.k)+'»</b> → '+money(failQ.net)+' en '+failQ.c+' operaciones.','bad']);
  if(buen.length>=3&&flojo.length>=3){const ab=sum(buen)/buen.length,af=sum(flojo)/flojo.length;out.push(['Con buen proceso (75 % o más del checklist) ganas de media <b>'+money(ab)+'</b> ('+buen.length+' op.); con proceso flojo, <b>'+money(af)+'</b> ('+flojo.length+' op.).',ab>af?'good':'bad']);}
  const lucky=cl.filter(t=>t.res>0&&(t.rules==='no'||t.rules==='part'));
  if(lucky.length>=2)out.push(['Ganaste <b>'+lucky.length+'</b> operaciones rompiendo tus reglas ('+money(sum(lucky))+'). Son suerte, no proceso: repetirlas es apostar.','bad']);
  const costly=group(a,t=>t.errs).filter(x=>x.c>=2).sort((x,y)=>x.net-y.net)[0];
  if(costly&&costly.net<0)out.push(['El error que más dinero te cuesta es <b>'+esc(costly.k.toLowerCase())+'</b>: '+money(costly.net)+' en '+costly.c+' operaciones.','bad']);
  const rk=cl.filter(t=>t.risk>0),med=median(rk.map(t=>t.risk));
  if(rk.length>=6&&med){const big=rk.filter(t=>t.risk>1.5*med),nor=rk.filter(t=>t.risk<=1.5*med);
    if(big.length>=3)out.push(['Cuando arriesgas más de lo habitual (más de '+plain(1.5*med)+') llevas <b>'+money(sum(big))+'</b> en '+big.length+' operaciones; el resto, '+money(sum(nor))+'.',sum(big)<0?'bad':'good']);}
  const ed=group(cl,t=>durs(t)).filter(x=>x.c>=3&&EMO_TONE[x.k]!=='good').sort((x,y)=>x.net-y.net)[0];
  if(ed&&ed.net<0)out.push(['Con <b>'+esc(ed.k.toLowerCase())+'</b> durante la operación llevas '+money(ed.net)+' en '+ed.c+' operaciones.','bad']);
  const em=group(cl,t=>t.pre).filter(x=>x.c>=3&&EMO_TONE[x.k]!=='good').sort((x,y)=>x.net-y.net)[0];
  if(em&&em.net<0)out.push(['Entrar con <b>'+esc(em.k.toLowerCase())+'</b> te ha costado <b>'+money(em.net)+'</b> en '+em.c+' operaciones.','bad']);
  const sk=cl.filter(t=>t.kl);
  const noKL=sk.filter(t=>t.kl==='Sin key level'),noIF=sk.filter(t=>t.ifvg==='Sin IFVG');
  if(noKL.length>=2)out.push(['Entraste <b>sin key level</b> '+noKL.length+' veces: '+money(sum(noKL))+'.',sum(noKL)<0?'bad':'good']);
  if(noIF.length>=2)out.push(['Entraste <b>sin IFVG</b> '+noIF.length+' veces: '+money(sum(noIF))+'.',sum(noIF)<0?'bad':'good']);
  const hiC=sk.filter(t=>(t.conf||[]).length>=5),loC=sk.filter(t=>(t.conf||[]).length<=2);
  if(hiC.length>=3&&loC.length>=3){const ah=sum(hiC)/hiC.length,al=sum(loC)/loC.length;out.push(['Con 5 o más confluencias ganas de media <b>'+money(ah)+'</b> ('+hiC.length+' op.); con 2 o menos, <b>'+money(al)+'</b> ('+loC.length+' op.).',ah>al?'good':'bad']);}
  const bk=group(sk,t=>t.kl).filter(x=>x.c>=3&&x.k!=='Sin key level'&&x.k!=='Otro').sort((x,y)=>y.net-x.net)[0];
  if(bk&&bk.net>0)out.push(['Tu key level más rentable es <b>'+esc(bk.k)+'</b>: '+money(bk.net)+' en '+bk.c+' operaciones.','good']);
  /* 2) lo que sí funciona */
  const si=r.find(x=>x.k==='Sí'),no=r.filter(x=>x.k!=='Sí'),noN=no.reduce((x,y)=>x+y.c,0),noNet=no.reduce((x,y)=>x+y.net,0);
  if(si&&si.c>=3&&noN>=3)out.push(['Siguiendo tus reglas ganas de media <b>'+money(si.avg)+'</b> por operación ('+si.c+' op.). Sin seguirlas, <b>'+money(noNet/noN)+'</b> ('+noN+' op.).',noNet/noN<si.avg?'good':'bad']);
  const bs=group(cl,t=>t.setup).filter(x=>x.c>=3).sort((x,y)=>y.net-x.net)[0];
  if(bs&&bs.net>0)out.push(['Tu setup más rentable es <b>'+esc(bs.k)+'</b>: '+money(bs.net)+' en '+bs.c+' operaciones.','good']);
  const er=group(a,t=>t.errs).sort((x,y)=>y.n-x.n)[0];
  if(er&&!(costly&&costly.net<0&&costly.k===er.k))out.push(['El error que más repites es <b>'+esc(er.k.toLowerCase())+'</b> ('+er.n+' veces, '+money(er.net)+').','bad']);
  return out;}

function suggestAmt(){if(F.amtAuto===false)return;const rk=num(F.risk),rr=num(F.rr);if(F.state==='loss'&&rk>0)F.amt=String(rk);else if(F.state==='win'&&rk>0&&rr>0)F.amt=String(Math.round(rk*rr*100)/100);}
function saveForm(){
  if(!F.side){toast('Elige compra o venta');return;}
  if(!F.state){toast('Elige el resultado (o «Aún abierta»)');return;}
  let res=null,r=null;const a=num(F.amt),risk=num(F.risk),rr=num(F.rr);
  if(F.state==='win'||F.state==='loss'){if(!(a>0)){toast('Pon el importe del resultado');return;}res=(F.state==='win'?1:-1)*a;}
  else if(F.state==='be')res=0;
  const strict=!F.id||F.v>=1;      // las operaciones antiguas no obligan a rellenar lo nuevo
  if(strict){
    if(!(risk>0)){toast('Pon el riesgo en $: sin él no podemos ver cuándo arriesgas de más');return;}
    if(!(rr>0)){toast('Elige el RR planeado');return;}
    if(!F.kind){toast('Elige el tipo: backtesting, evaluación o fondeada');return;}
    if(F.kind==='bt'){if(!F.date){toast('Pon el día simulado que estás repasando');return;}if(!F.time){toast('Pon la hora simulada de la entrada');return;}}
  }
  if(F.state==='open')r=null;else if(risk>0)r=Math.round(100*res/risk)/100;else r=num(F.r);
  let ts=Date.parse(F.date+'T'+(F.time||'12:00')+':00');if(!isFinite(ts))ts=Date.now();
  if(F.kind==='bt'&&F.tz==='NY'&&F.date)ts=zonedToUtc(F.date,F.time||'12:00',TZ_NY);   // la hora del gráfico de backtesting es la de Nueva York
  const old=F.id&&S.trades[F.id]?S.trades[F.id]:{};
  if(old.ts&&old.date===F.date&&old.time===F.time&&(old.tz||'ES')===(F.kind==='bt'?F.tz:'ES'))ts=old.ts;
  const t=Object.assign({},old,{id:F.id||uid(),ts,date:F.date||dateOf(ts),time:F.time||hm(ts),side:F.side,acc:F.acc,instr:F.instr.trim()||'NQ',setup:F.setup,res,r,risk:risk>0?risk:null,rr:rr>0?rr:null,kind:F.kind,tz:F.kind==='bt'?F.tz:undefined,img:Object.fromEntries(Object.entries(F.img||{}).filter(e=>String(e[1]).trim()).map(e=>[e[0],String(e[1]).trim()])),kl:F.kl,ifvg:F.ifvg,conf:F.conf,htf:F.htf.trim(),ltf:F.ltf.trim(),chk:F.chk,pre:F.pre,dur:F.dur,post:F.post,rules:F.rules,errs:(F.rules==='part'||F.rules==='no')?F.errs:[],note:F.note.trim()});
  if(strict)t.v=F.v||2;
  if(F.ex)t.ex=true;
  if(!old.cr)t.cr=Date.now();
  if(F.kind){S.cfg.last=S.cfg.last||{};const d=S.cfg.last[F.kind]=S.cfg.last[F.kind]||{};if(risk>0)d.risk=String(risk);if(rr>0)d.rr=String(rr);S.cfg.lastKind=F.kind;if(F.kind==='bt'){S.cfg.lastBtDate=F.date;S.cfg.lastBtTime=F.time;S.cfg.lastTz=F.tz;}}
  if(risk>0)S.cfg.lastRisk=String(risk);if(rr>0)S.cfg.lastRR=String(rr);
  S.cfg.instr=t.instr;putTrade(t);saveCfg();if(typeof imgCleanup==='function')imgCleanup(old,t);closeSheet();softRender();
  toast(isPend(t)?'Guardada · queda por completar (análisis, checklist e imágenes)':'Operación guardada');
  if(TVQ.length){const nid=TVQ.shift();if(S.trades[nid])setTimeout(()=>openSheet(S.trades[nid]),300);}
}

    else if(k==='rules'){F.rules=F.rules===v?'':v;}

  S.trades=clean(o.trades||{});
  S.cfg=Object.assign({goal:30000,btGoalMin:180,btLog:[],timer:null,reviews:{},customSetups:[],instr:'NQ'},clean(o.cfg||{}));
  saveLocal();
  if(!silent&&typeof cloudReplaceAll==='function')cloudReplaceAll(prevIds);
  if(DB.trades){Object.values(S.trades).forEach(t=>enqueue(()=>DB.trades.doc(t.id).set(clean(t))));saveCfg();}
}
function doBackup(){
  S.cfg.lastBackup=Date.now();saveCfg();
  const o={app:'centro-de-mando',version:1,exportedAt:new Date().toISOString(),trades:S.trades,cfg:S.cfg};
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,1)],{type:'application/json'}));
  a.download='centro-de-mando-copia-'+todayES()+'.json';document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);toast('Copia descargada');
}
/* copia al portapapeles solo las operaciones y las cuentas, para pegarlas donde haga falta */
function pasteData(){
  dialog('<h2 style="font-size:28px">Pegar datos</h2><p class="small muted">Pega aquí el texto que copiaste con «Copiar todos mis datos» en el otro dispositivo.</p><textarea id="pdTxt" style="width:100%;min-height:150px;background:var(--page2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font:12px monospace" placeholder="{&quot;app&quot;:&quot;centro-de-mando&quot;…"></textarea>',
    [{label:'Cancelar'},{label:'Continuar',primary:true,run:()=>{
      try{const o=JSON.parse(document.getElementById('pdTxt').value.trim());if(!o||!o.trades||!o.cfg)throw 0;askReplace(o,'Cargar los datos pegados');}
      catch(e){toast('Ese texto no parece una copia de la app');return false;}
    }}]);
}
function copyData(full){
  const o={app:'centro-de-mando',version:1,exportedAt:new Date().toISOString(),trades:S.trades,cfg:full?S.cfg:{acc:S.cfg.acc||{list:[]}}};
  const txt=JSON.stringify(o);
  const fallback=()=>{dialog('<h2 style="font-size:28px">Copia este texto</h2><p class="small muted">Selecciónalo todo (Ctrl+A dentro del cuadro) y cópialo (Ctrl+C).</p><textarea id="cpTxt" readonly style="width:100%;min-height:160px;background:var(--page2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px;font:12px monospace">'+esc(txt)+'</textarea>',[{label:'Cerrar'}]);const t=document.getElementById('cpTxt');if(t){t.focus();t.select();}};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(()=>toast('Copiado. Pégalo en el chat con Ctrl+V')).catch(fallback);else fallback();
}
/* une sin borrar nada: añade solo las operaciones y las cuentas que aún no existen (por id) */
function mergeData(o){
  let nt=0,na=0;
  Object.values((o&&o.trades)||{}).forEach(t=>{if(t&&t.id&&!t.del&&!S.trades[t.id]){putTrade(clean(t));nt++;}});
  const A=accData(),inc=(((o||{}).cfg||{}).acc||{}).list||[];
  inc.forEach(a=>{if(a&&a.id&&!A.list.some(x=>x.id===a.id)){A.list.push(Object.assign({hist:[],payouts:[],fees:[]},clean(a)));na++;}});
  if(na)saveCfg();
  return{nt,na};
}
function askReplace(o,what){
  dialog('<h2 style="font-size:28px">'+what+'</h2><p><b>Unir</b> añade solo las operaciones y cuentas que aún no tienes y <b>no borra nada</b>. <b>Reemplazar</b> sustituye todos los datos que tienes ahora (operaciones, cuentas, notas, repaso) y no se puede deshacer.</p>',
    [{label:'Cancelar'},{label:'Reemplazar',run:()=>{applyData(o);render();toast('Datos cargados');}},{label:'Unir sin borrar',primary:true,run:()=>{const r=mergeData(o);render();toast('Añadidas '+r.nt+' operaciones y '+r.na+' cuentas');}}]);
}
function confirmSeed(){
  fetch('datos/semilla.json').then(r=>{if(!r.ok)throw 0;return r.json();}).then(j=>askReplace(j,'Cargar mis datos iniciales')).catch(()=>toast('No encuentro datos/semilla.json (hay que abrir la app desde su servidor)'));
}
$('#restoreFile').addEventListener('change',e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{try{const o=JSON.parse(rd.result);if(!o||!o.trades||!o.cfg)throw 0;askReplace(o,'Restaurar copia');}catch(x){toast('Ese archivo no parece una copia de la app');}};
  rd.readAsText(f);
});

cloudBaseline();
render();
initDb();
cloudInit();
loadAutoNews();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1'))navigator.serviceWorker.register('sw.js').catch(()=>{});
if(FIRST_RUN){fetch('datos/semilla.json').then(r=>r.ok?r.json():null).then(j=>{if(j&&j.trades){applyData(j,true);cloudBaseline();render();toast('He cargado tus datos iniciales');}}).catch(()=>{});}
</script>
